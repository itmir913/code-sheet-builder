<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CodeSheet Builder - 교사를 위한 코딩 학습지 제작 도구 | Teacher Utility Kit</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Gmarket+Sans:wght@300;500;700&display=swap"
          rel="stylesheet"/>

    <!-- Language Registry -->
    <script src="./js/languages.js"></script>

    <!-- SortableJS -->
    <script src="./lib/sortablejs@1.15.0.js"></script>

    <!-- Monaco Editor Loader -->
    <script src="./lib/monaco-editor@0.45.0.js"></script>

    <link rel="stylesheet" href="./css/styles.css"/>
</head>
<body>

<!-- ═══════════════════════════════════════
     APP SHELL
═══════════════════════════════════════ -->
<div id="app">

    <!-- TOP NAV -->
    <header class="nav" id="nav">
        <div class="nav-left">
            <div class="nav-logo">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect width="28" height="28" rx="8" fill="url(#logoGrad)"/>
                    <path d="M8 10l4 4-4 4M14 18h6" stroke="#fff" stroke-width="2" stroke-linecap="round"
                          stroke-linejoin="round"/>
                    <defs>
                        <linearGradient id="logoGrad" x1="0" y1="0" x2="28" y2="28">
                            <stop stop-color="#6366f1"/>
                            <stop offset="1" stop-color="#8b5cf6"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span class="nav-logo-text">CodeSheet</span>
            </div>

            <div class="nav-meta">
                <input id="ws-title" class="nav-title-input" type="text" placeholder="학습지 제목 입력..." spellcheck="false"/>
            </div>
        </div>

        <div class="nav-right">

            <a href="https://raw.githubusercontent.com/itmir913/teacher-utility-kit/master/code-sheet-builder/docs/CodeSheet_Example_Code.zip"
               class="nav-btn nav-btn-download"
               id="btn-examples">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                예제코드
            </a>

            <a href="https://github.com/itmir913/teacher-utility-kit/releases/download/latest/code-sheet-builder.zip"
               class="nav-btn nav-btn-download"
               id="btn-offline">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                오프라인 버전
            </a>

            <span class="nav-divider"></span>

            <button class="nav-btn" id="btn-new">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                새 학습지
            </button>
            <button class="nav-btn" id="btn-load">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M7 1v8M3 6l4 4 4-4M2 11h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
                불러오기
            </button>
            <button class="nav-btn" id="btn-save">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M7 9V1M3 5l4-4 4 4M2 11h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
                저장
            </button>

            <span class="nav-divider"></span>

            <div class="view-switcher">
                <button class="view-btn active" data-view="student" id="btn-view-student">
                    <span class="view-btn-icon">👤</span> 학생용
                </button>
                <button class="view-btn" data-view="answer" id="btn-view-answer">
                    <span class="view-btn-icon">✅</span> 정답지
                </button>
            </div>

            <button class="nav-btn nav-btn-primary" id="btn-print">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <rect x="2" y="5" width="10" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M4 5V2h6v3M4 9h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                인쇄 / PDF
            </button>
        </div>
    </header>

    <!-- WORKSPACE -->
    <div class="workspace" id="workspace">
        <button class="sidebar-toggle" id="btn-sidebar-toggle" aria-label="사이드바 접기/펼치기"></button>

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-section" style="padding: 0">
                <div class="sidebar-accordion" id="info-accordion">
                    <button class="accordion-trigger" data-target="info-panel">
                        <span class="sidebar-label" style="margin:0">학습지 정보</span>
                        <svg class="accordion-arrow" width="12" height="12" viewBox="0 0 12 12" fill="none">
                            <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                  stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="accordion-panel" id="info-panel">
                        <div class="info-fields">
                            <input class="field-input" id="ws-subject" type="text" placeholder="과목명"/>
                            <input class="field-input" id="ws-grade" type="text" placeholder="학년 / 반"/>
                            <input class="field-input" id="ws-date" type="date"/>
                        </div>
                        <div class="design-row" style="margin-top: 8px;">
                            <span class="design-label">기본 언어</span>
                            <select class="design-select" id="ws-default-lang"></select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sidebar-section sidebar-section-grow">
                <div class="sidebar-section-header">
                    <span class="sidebar-label">문제 목록</span>
                    <button class="btn-add-prob" id="btn-add-problem" title="문제 추가">
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                            <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
                <div class="prob-list" id="prob-list">
                    <div class="prob-list-empty">+ 버튼으로 첫 문제를 추가하세요</div>
                </div>
            </div>

            <div class="sidebar-section sidebar-section-design">
                <div class="sidebar-accordion" id="design-accordion">
                    <button class="accordion-trigger" data-target="design-panel">
                        <span class="sidebar-label" style="margin:0">디자인 설정</span>
                        <svg class="accordion-arrow" width="12" height="12" viewBox="0 0 12 12" fill="none">
                            <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                  stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="accordion-panel" id="design-panel">
                        <div class="design-row">
                            <span class="design-label">폰트 크기</span>
                            <div class="design-control">
                                <input type="range" class="design-slider" id="set-font-size" min="8" max="14"
                                       value="10"/>
                                <span class="design-val" id="set-font-size-val">10pt</span>
                            </div>
                        </div>
                        <div class="design-row">
                            <span class="design-label">줄 간격</span>
                            <div class="design-control">
                                <input type="range" class="design-slider" id="set-line-height" min="1.2" max="2.2"
                                       step="0.1" value="1.6"/>
                                <span class="design-val" id="set-line-height-val">1.6</span>
                            </div>
                        </div>
                        <div class="design-row">
                            <span class="design-label">답안 줄수</span>
                            <div class="design-control">
                                <input type="range" class="design-slider" id="set-answer-lines" min="0" max="8"
                                       value="2"/>
                                <span class="design-val" id="set-answer-lines-val">2줄</span>
                            </div>
                        </div>
                        <div class="design-row">
                            <span class="design-label">레이아웃</span>
                            <select class="design-select" id="set-layout">
                                <option value="auto">자동</option>
                                <option value="1">1열</option>
                                <option value="2">2열</option>
                            </select>
                        </div>
                        <div class="design-row">
                            <span class="design-label">코드 테마</span>
                            <select class="design-select" id="set-code-theme">
                                <option value="light">라이트</option>
                                <option value="github">GitHub</option>
                                <option value="minimal">미니멀</option>
                            </select>
                        </div>
                        <div class="design-row">
                            <span class="design-label">여백 (mm)</span>
                            <input type="number" class="design-num" id="set-margin" value="15" min="5" max="30"/>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CANVAS -->
        <main class="canvas" id="canvas">
            <!-- Welcome screen -->
            <div class="canvas-welcome" id="canvas-welcome">
                <div class="welcome-inner">
                    <div class="welcome-icon">
                        <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
                            <rect width="56" height="56" rx="16" fill="url(#wGrad)"/>
                            <path d="M16 20l8 8-8 8M28 36h12" stroke="#fff" stroke-width="3" stroke-linecap="round"
                                  stroke-linejoin="round"/>
                            <defs>
                                <linearGradient id="wGrad" x1="0" y1="0" x2="56" y2="56">
                                    <stop stop-color="#6366f1"/>
                                    <stop offset="1" stop-color="#a78bfa"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <h1 class="welcome-title">CodeSheet Builder</h1>
                    <p class="welcome-desc">왼쪽 사이드바에서 <strong>+</strong>를 눌러 첫 문제를 추가하세요.<br/>Monaco 에디터로 코드를 작성하고, 드래그로
                        빈칸을 만드세요.</p>
                    <div class="welcome-features">
                        <div class="feat-card">
                            <span class="feat-emoji">✏️</span>
                            <span>Monaco 코드 에디터</span>
                        </div>
                        <div class="feat-card">
                            <span class="feat-emoji">🎭</span>
                            <span>드래그 마스킹</span>
                        </div>
                        <div class="feat-card">
                            <span class="feat-emoji">🖨️</span>
                            <span>A4 인쇄 최적화</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Problems container -->
            <div class="problems-canvas" id="problems-canvas" style="display:none;"></div>
        </main>
    </div>
</div>

<!-- ═══════════════════════════════════════
     MASK POPUP
═══════════════════════════════════════ -->
<div class="mask-popup" id="mask-popup" style="display:none;">
    <span class="mask-popup-label">마스크 유형 선택</span>
    <button class="mask-popup-btn" data-type="blank">
        <span class="mask-popup-icon">▬</span> 빈칸
    </button>
    <button class="mask-popup-btn" data-type="comment">
        <span class="mask-popup-icon">/**/</span> 주석
    </button>
    <button class="mask-popup-btn" data-type="hidden">
        <span class="mask-popup-icon">■■</span> 숨김
    </button>
    <button class="mask-popup-cancel" id="mask-popup-cancel">✕</button>
</div>

<!-- ═══════════════════════════════════════
     MODAL
═══════════════════════════════════════ -->
<div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div class="modal-title" id="modal-title">알림</div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
    </div>
</div>

<!-- ═══════════════════════════════════════
     PRINT AREA
═══════════════════════════════════════ -->
<div id="print-area" class="print-area"></div>

<input type="file" id="file-input" accept=".json" style="display:none;"/>

<!-- Scripts -->
<script src="./js/store/state.js"></script>
<script src="./js/services/mask.service.js"></script>
<script src="./js/components/print.js"></script>
<script src="./js/components/problem-editor.js"></script>
<script src="./js/components/sidebar.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
